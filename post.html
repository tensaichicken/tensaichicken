<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天才チキンの投稿まとめ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #ffffff;
            --main-color: #1a1a1a;
            --accent-pink: #ff4757;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--main-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--main-color);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900;
            font-size: 0.85rem;
            border: 2px solid var(--main-color);
            padding: 4px 12px;
            box-shadow: 3px 3px 0px var(--main-color);
            transition: 0.1s;
        }

        .back-btn:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--main-color);
        }

        .page-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.6rem;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 1.5px;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 🌟 各投稿のアコーディオン */
        .post-item {
            border: 3px solid var(--main-color);
            box-shadow: 5px 5px 0px var(--main-color);
            background: white;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .post-item.active {
            box-shadow: 6px 6px 0px var(--accent-pink);
            transform: translateY(-2px);
        }

        .post-trigger {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            background: white;
        }

        .trigger-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
        }

        .post-date {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--accent-pink);
        }

        .post-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            margin: 0;
            line-height: 1.4;
            color: var(--main-color);
        }

        .post-icon {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
            margin-left: 10px;
            color: #ccc;
        }

        .post-item.active .post-icon {
            transform: rotate(180deg);
            color: var(--accent-pink);
        }

        .post-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #ffffff;
        }

        .post-body {
            padding: 15px; /* ハッシュタグを消した分、すっきりめの余白に調整 */
            border-top: 2px solid var(--main-color);
            text-align: left;
            background-color: #fafafa;
        }

        .post-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 400;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #444;
            margin: 0;
        }

        /* 📍 公式感タグ */
        .official-footer-tag {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #1a1a1a;
            background-color: #ffffff;
            padding: 3px 6px;
            border: 2px solid #1a1a1a;
            z-index: 100;
        }

        @media (max-width: 600px) {
            .page-title { font-size: 1.3rem; }
            .post-title { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="official-footer-tag">天才チキンの投稿まとめ</div>

    <div class="container">
        <header class="header">
            <a href="index.html" class="back-btn">← BACK</a>
            <h1 class="page-title">POSTS</h1>
        </header>

        <div class="post-list">
            <!-- 投稿 1 -->
            <div class="post-item">
                <div class="post-trigger" onclick="togglePost(this)">
                    <div class="trigger-left">
                        <span class="post-date">2026.06.03</span>
                        <h2 class="post-title">ホームページ作成を作成しました！！</h2>
                    </div>
                    <div class="post-icon"><i class="fa-solid fa-chevron-down"></i></div>
                </div>
                <div class="post-content">
                    <div class="post-body">
                        <p class="post-text">
                            ホームページを作成しました！なかなかに時間かかったので，たまに見に来てくれると嬉しいです！
                            更新は不定期ですが，気分が向いたら投稿いたします．
                            新しいことを始めるのはいくつになっても，わくわくします．始めて良かったと思える日を楽しみにしています．
                        </p>
                    </div>
                </div>
            </div>

         
    <script>
        function togglePost(element) {
            const postItem = element.parentElement;
            const content = postItem.querySelector('.post-content');
            postItem.classList.toggle('active');
            if (postItem.classList.contains('active')) {
                content.style.maxHeight = content.scrollHeight + "px";
            } else {
                content.style.maxHeight = "0";
            }
        }
    </script>
</body>
</html>
